<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Dinâmico de Dispositivos e IPs</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --primary: #007bff;
            --primary-hover: #0056b3;
            --danger: #dc3545;
            --success: #28a745;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #111;
            margin-bottom: 30px;
        }

        /* Área de Input para Adicionar IP */
        .search-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: var(--primary-hover);
        }

        /* Grelha de Dispositivos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid #ccc;
            position: relative;
        }

        .card.my-ip {
            border-top-color: var(--primary);
        }

        .card.added-ip {
            border-top-color: #6f42c1;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-me { background: #e3f2fd; color: #0d47a1; }
        .badge-device { background: #f3e5f5; color: #4a148c; }

        .info-line {
            font-size: 0.9rem;
            margin: 10px 0;
            line-height: 1.4;
        }

        .info-line strong {
            color: #555;
        }

        .remove-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            display: none;
        }

        .card.added-ip .remove-btn {
            display: block;
        }

        /* Terminal Estilizado */
        .terminal-container {
            background: #121212;
            color: #00ff00;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            font-family: 'Courier New', Courier, monospace;
        }

        #terminal-output {
            height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestor de Dispositivos e IPs</h1>

    <!-- Barra para introduzir IP manualmente -->
    <div class="search-box">
        <input type="text" id="ip-input" placeholder="Introduza um endereço IP (ex: 192.168.1.15 ou 8.8.8.8)..." onkeypress="checkEnter(event)">
        <button onclick="addNewDevice()">Adicionar Dispositivo</button>
    </div>

    <!-- Grelha de Cartões (O seu IP e os adicionados) -->
    <div class="grid" id="devices-grid">
        <!-- O Cartão do utilizador será injetado aqui via JavaScript -->
        <div class="card my-ip" id="my-ip-card">
            <h2>O Seu Dispositivo <span class="badge badge-me">Meu IP</span></h2>
            <div id="my-ip-details">
                <div class="info-line"><strong>IP Público:</strong> A carregar...</div>
                <div class="info-line"><strong>Operadora:</strong> A carregar...</div>
                <div class="info-line"><strong>Localização:</strong> A carregar...</div>
            </div>
        </div>
    </div>

    <!-- Feedback do Console Interno -->
    <div class="terminal-container">
        <div id="terminal-output">> Sistema inicializado. A ler informações de rede...</div>
    </div>
</div>

<script>
    // Executado ao abrir a página: Deteta o seu IP Real
    window.onload = function() {
        fetch('https://ipapi.co')
            .then(res => res.json())
            .then(data => {
                const detailsDiv = document.getElementById('my-ip-details');
                detailsDiv.innerHTML = `
                    <div class="info-line"><strong>IP Público:</strong> ${data.ip}</div>
                    <div class="info-line"><strong>Operadora/ISP:</strong> ${data.org || 'Desconhecida'}</div>
                    <div class="info-line"><strong>Localização:</strong> ${data.city}, ${data.country_name}</div>
                    <div class="info-line"><strong>Coodenadas:</strong> Lat ${data.latitude} / Lon ${data.longitude}</div>
                `;
                printTerminal(`[OK] O seu IP Público detetado com sucesso: ${data.ip}`);
            })
            .catch(err => {
                // Fallback caso falte internet ou a API falhe
                document.getElementById('my-ip-details').innerHTML = `
                    <div class="info-line"><strong>IP Local Falso:</strong> 192.168.1.25</div>
                    <div class="info-line"><strong>Operadora:</strong> Rede Local (Offline)</div>
                    <div class="info-line"><strong>Gateway:</strong> 192.168.1.1</div>
                `;
                printTerminal(`[AVISO] Não foi possível obter o IP público real. A usar dados locais padrão.`);
            });
    };

    // Função para adicionar um novo IP na interface
    function addNewDevice() {
        const input = document.getElementById('ip-input');
        const ipValue = input.value.trim();

        // Validação básica de preenchimento
        if (!ipValue) {
            alert("Por favor, introduza um IP válido.");
            return;
        }

        // Gera dados simulados detalhados para o IP introduzido
        const isLocal = ipValue.startsWith('192.') || ipValue.startsWith('10.') || ipValue.startsWith('127.');
        const macSimulado = generateMacAddress();
        const hostnameSimulado = isLocal ? `PC-Rede-${ipValue.split('.').pop()}` : `Host-Remoto-Server`;

        const grid = document.getElementById('devices-grid');
        
        // Criar o elemento HTML do novo cartão
        const newCard = document.createElement('div');
        newCard.className = 'card added-ip';
        newCard.innerHTML = `
            <button class="remove-btn" onclick="this.parentElement.remove(); printTerminal('Dispositivo removido da lista.');">×</button>
            <h2>${hostnameSimulado} <span class="badge badge-device">Detetado</span></h2>
            <div class="info-line"><strong>Endereço IP:</strong> ${ipValue}</div>
            <div class="info-line"><strong>Endereço MAC:</strong> ${macSimulado}</div>
            <div class="info-line"><strong>Tipo de Rede:</strong> ${isLocal ? 'Rede Interna (LAN)' : 'Rede Externa (WAN)'}</div>
            <div class="info-line"><strong>Estado:</strong> <span style="color: #28a745; font-weight: bold;">Ativo</span></div>
        `;

        grid.appendChild(newCard);
        printTerminal(`[SUCESSO] Dispositivo adicionado: ${ipValue} (${hostnameSimulado})`);
        
        // Limpa o input
        input.value = '';
    }

    // Atalho para carregar no Enter do teclado
    function checkEnter(event) {
        if (event.key === 'Enter') {
            addNewDevice();
        }
    }

    // Gera um MAC Address aleatório para ilustração
    function generateMacAddress() {
        const hex = '0123456789ABCDEF';
        let mac = '';
        for (let i = 0; i < 6; i++) {
            mac += hex[Math.floor(Math.random() * 16)] + hex[Math.floor(Math.random() * 16)];
            if (i < 5) mac += ':';
        }
        return mac;
    }

    // Escreve logs no mini terminal abaixo da página
    function printTerminal(message) {
        const terminal = document.getElementById('terminal-output');
        terminal.innerText += `\n> ${message}`;
        terminal.scrollTop = terminal.scrollHeight;
    }
</script>

</body>
</html>
